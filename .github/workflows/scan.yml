name: OVPN IP Scan

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:        # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, intl, dom

      - name: Install dig (dnsutils)
        run: sudo apt update && sudo apt install -yq dnsutils

      - name: Run scanner
        run: php ovpn.php --dig --output=results/servers.json

      - name: Write metadata
        run: |
          cat > results/meta.json << JSON
          {
            "scanned_at": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "cities":     $(jq 'length' results/servers.json),
            "ips":        $(jq '[.[] | (.ips // []) | length] | add // 0' results/servers.json)
          }
          JSON

      - name: Benchmark
        run: php bench.php --input=results/servers.json --output=results/bench.json

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || \
            git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
